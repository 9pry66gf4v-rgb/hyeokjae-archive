
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>혁재 아카이브 ♡</title>

<style>
:root {
  --navy: #303f9c;
  --blue: #7f9cf4;
  --lavender: #d9dcff;
  --light: #f8f7ff;
  --aqua: #c6f0fa;
  --pink: #ffd9eb;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #edf0ff;
  background-image: radial-gradient(#d2d9ff 2px, transparent 2px);
  background-size: 22px 22px;
  font-family: "Malgun Gothic", Arial, sans-serif;
  color: var(--navy);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 28px 12px;
}
button { font: inherit; cursor: pointer; }
.device {
  width: min(100%, 440px);
  padding: 28px 24px 34px;
  border: 5px solid var(--navy);
  border-radius: 95px 95px 115px 115px;
  background: linear-gradient(145deg,#f3eaff,#c4d2ff 70%,#b6c8ff);
  box-shadow: inset 7px 7px #fff8,
    inset -8px -8px #7e91e855,
    10px 13px 0 #9ca9e4;
  position: relative;
}
.device-title {
  text-align: center;
  font-size: 20px;
  font-weight: 900;
  margin: 6px 0 15px;
  text-shadow: 2px 2px white;
}
.device-title small {
  display: block;
  font-size: 9px;
  letter-spacing: 3px;
  margin-top: 4px;
}
.screen-frame {
  padding: 12px;
  background: #a9b9fa;
  border: 4px solid var(--navy);
  border-radius: 24px;
  box-shadow: inset 4px 4px #e7eaff;
}
.screen {
  height: 420px;
  overflow-y: auto;
  background: var(--light);
  border: 3px solid var(--navy);
  border-radius: 9px;
  scrollbar-width: thin;
  scrollbar-color: var(--blue) transparent;
}
.status {
  height: 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 9px;
  background: #dce5ff;
  border-bottom: 3px solid var(--navy);
  font-size: 11px;
  font-weight: bold;
}
.page { display: none; padding: 12px; }
.page.active { display: block; }
.page-title {
  text-align: center;
  font-size: 15px;
  margin: 3px 0 13px;
  border-bottom: 2px dashed var(--blue);
  padding-bottom: 10px;
}
.aquarium {
  position: relative;
  background: linear-gradient(#a9e6ff,#77c6f1);
  border: 3px solid var(--navy);
  min-height: 80px;
  overflow: hidden;
}
.aquarium::after {
  content: "✧ ｡ 🫧 ｡ ✧";
  position: absolute;
  right: 8px;
  top: 8px;
  font-size: 12px;
  pointer-events: none;
}
video {
  display: block;
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  background: #9bd6ef;
}
.welcome {
  margin: 12px 0;
  padding: 12px;
  border: 2px solid var(--navy);
  background: white;
  text-align: center;
  font-size: 12px;
  line-height: 1.9;
}
.menu-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
}
.menu-item {
  border: 2px solid var(--navy);
  background: #e5eaff;
  min-height: 75px;
  padding: 8px 3px;
  box-shadow: 3px 3px 0 #a0b1ed;
  color: var(--navy);
  font-weight: bold;
  font-size: 10px;
}
.menu-item .emoji {
  display: block;
  font-size: 25px;
  margin-bottom: 5px;
}
.menu-item.selected,
.menu-item:focus-visible,
.menu-item:hover {
  background: var(--pink);
  outline: 2px solid var(--navy);
  outline-offset: 2px;
}
.entry {
  display: block;
  width: 100%;
  margin: 9px 0;
  padding: 12px;
  text-align: left;
  color: var(--navy);
  background: white;
  border: 2px solid var(--navy);
  box-shadow: 3px 3px #b1b9ee;
  font-size: 12px;
  line-height: 1.8;
}
.entry.selected,
.entry:focus-visible {
  background: var(--pink);
  outline: 2px solid var(--navy);
}
.entry strong { font-size: 14px; }
.character-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
}
.character-tile {
  background: #e4f3ff;
  border: 2px solid var(--navy);
  color: var(--navy);
  padding: 10px 5px;
  font-weight: bold;
}
.character-tile.selected,
.character-tile:focus-visible {
  background: var(--pink);
  outline: 2px solid var(--navy);
}
.avatar {
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 42px;
  background: #c6e9fa;
  margin-bottom: 8px;
  overflow: hidden;
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.profile-image {
  display: block;
  max-width: 100%;
  max-height: 240px;
  margin: 10px auto;
  object-fit: contain;
  border: 2px solid var(--navy);
}
.profile-text {
  background: white;
  border: 2px solid var(--navy);
  padding: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 12px;
  line-height: 1.9;
}
.empty {
  text-align: center;
  padding: 30px 10px;
  line-height: 2;
  font-size: 12px;
}
.controls {
  display: flex;
  justify-content: center;
  gap: 22px;
  margin-top: 22px;
}
.control {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  border: 4px solid var(--navy);
  background: linear-gradient(#f9f9ff,#94a9ff);
  color: var(--navy);
  font-size: 25px;
  font-weight: 900;
  box-shadow: 3px 5px 0 #7a8cd3;
}
.control:active { transform: translateY(4px); box-shadow: none; }
.control-labels {
  display: flex;
  justify-content: center;
  gap: 22px;
  margin-top: 10px;
  font-size: 10px;
  font-weight: bold;
}
.control-labels span { width: 65px; text-align: center; }
.bottom-text {
  text-align: center;
  font-size: 10px;
  margin-top: 25px;
  letter-spacing: 1px;
}
.back-link {
  border: 2px solid var(--navy);
  background: var(--lavender);
  color: var(--navy);
  padding: 8px 12px;
  margin-bottom: 12px;
  font-weight: bold;
}
.note {
  font-size: 11px;
  line-height: 1.8;
  color: #5265ac;
}
@media(max-width:400px) {
  .device { padding: 23px 15px 28px; }
  .screen { height: 390px; }
  .controls { gap: 15px; }
}
@media(prefers-reduced-motion:reduce) {
  * { scroll-behavior: auto !important; }
}
</style>
</head>

<body>
<div class="device">
  <div class="device-title">
    ♥ 혁재 아카이브 ♥
    <small>HYEOKJAE ARCHIVE</small>
  </div>

  <div class="screen-frame">
    <div class="screen" id="screen">
      <div class="status">
        <span>◈ AQUARIUM</span>
        <span>♡ ♡ ♡ ▰</span>
      </div>

      <section class="page active" id="home">
        <h2 class="page-title">♡ HOME ♡</h2>
        <div class="aquarium">
          <video id="introVideo" autoplay muted loop playsinline controls>
            <source src="intro_compressed.mp4" type="video/mp4">
            동영상을 재생할 수 없습니다.
          </video>
        </div>
        <div class="welcome">
          작은 수족관에 어서 와! 🫧<br>
          이곳에는 정혁과 홍윤재의 이야기가<br>
          천천히 쌓여 가고 있어.
        </div>
        <div class="menu-grid" id="homeMenu">
          <button class="menu-item" data-page="characters">
            <span class="emoji">🐟</span>CHARACTER
          </button>
          <button class="menu-item" data-page="letters">
            <span class="emoji">💌</span>LETTER
          </button>
          <button class="menu-item" data-page="comics">
            <span class="emoji">📖</span>COMIC
          </button>
          <button class="menu-item" data-page="stories">
            <span class="emoji">🫧</span>STORY
          </button>
          <button class="menu-item" data-page="gallery">
            <span class="emoji">🐚</span>GALLERY
          </button>
          <button class="menu-item" data-page="settings">
            <span class="emoji">⚙️</span>SETTING
          </button>
        </div>
      </section>

      <section class="page" id="characters">
        <h2 class="page-title">🐟 CHARACTER</h2>
        <div class="character-grid" id="characterGrid"></div>
      </section>

      <section class="page" id="profile">
        <button class="back-link" data-page="characters">◀ BACK</button>
        <h2 class="page-title" id="profileName"></h2>
        <img id="profileImage" class="profile-image" alt="캐릭터 이미지" hidden>
        <div class="profile-text" id="profileText"></div>
      </section>

      <section class="page" id="letters">
        <h2 class="page-title">💌 LETTER BOX</h2>
        <div id="letterList"></div>
      </section>

      <section class="page" id="letterDetail">
        <button class="back-link" data-page="letters">◀ BACK</button>
        <h2 class="page-title" id="letterTitle"></h2>
        <div class="profile-text" id="letterBody"></div>
      </section>

      <section class="page" id="comics">
        <h2 class="page-title">📖 COMIC COLLECTION</h2>
        <div id="comicList"></div>
      </section>

      <section class="page" id="stories">
        <h2 class="page-title">🫧 STORY & LOG</h2>
        <div id="storyList"></div>
      </section>

      <section class="page" id="gallery">
        <h2 class="page-title">🐚 GALLERY</h2>
        <div id="galleryList"></div>
      </section>

      <section class="page" id="recordDetail">
        <button class="back-link" id="recordBack">◀ BACK</button>
        <h2 class="page-title" id="recordTitle"></h2>
        <div class="profile-text" id="recordBody"></div>
      </section>

      <section class="page" id="settings">
        <h2 class="page-title">⚙️ SETTING</h2>
        <button class="entry" id="soundButton">🔇 영상 소리 켜기</button>
        <button class="entry" id="pauseButton">⏸ 영상 일시정지</button>
        <p class="note">브라우저 자동 재생 정책에 따라 영상은 음소거 상태로 시작합니다.</p>
      </section>
    </div>
  </div>

  <div class="controls">
    <button class="control" id="prevBtn" aria-label="이전 항목">◀</button>
    <button class="control" id="selectBtn" aria-label="선택">♡</button>
    <button class="control" id="nextBtn" aria-label="다음 항목">▶</button>
  </div>
  <div class="control-labels">
    <span>PREV</span><span>SELECT</span><span>NEXT</span>
  </div>
  <div class="bottom-text">✧ A LITTLE WORLD UNDER THE BLUE ✧</div>
</div>

<script>
/* ===== 캐릭터 정보 ===== */
const characters = [
  {
    name: "정혁",
    type: "ORIGINAL CHARACTER",
    image: "",
    intro: "정혁의 소개를 입력해 주세요.",
    details: "나이: 미정\n성격: 미정\n기타 설정: 미정",
    story: "정혁의 이야기를 입력해 주세요."
  },
  {
    name: "홍윤재",
    type: "ORIGINAL CHARACTER",
    image: "",
    intro: "홍윤재의 소개를 입력해 주세요.",
    details: "나이: 미정\n성격: 미정\n기타 설정: 미정",
    story: "홍윤재의 이야기를 입력해 주세요."
  }
];

/* ===== 기록 데이터 =====
   아래 배열에 나중에 편지와 만화를 추가할 수 있어요.
*/
const letters = [];
const comics = [];
const stories = [];
const gallery = [];

const screen = document.getElementById("screen");
const video = document.getElementById("introVideo");
const pages = [...document.querySelectorAll(".page")];
let currentPage = "home";
let previousRecordPage = "home";
let selectedIndex = 0;

function pageButtons() {
  return [...document.querySelectorAll(
    "#" + currentPage + " button:not([disabled])"
  )];
}

function updateSelection() {
  const buttons = pageButtons();
  if (buttons.length === 0) return;
  selectedIndex = Math.max(0, Math.min(selectedIndex, buttons.length - 1));
  document.querySelectorAll(".selected").forEach(el => {
    el.classList.remove("selected");
  });
  buttons[selectedIndex].classList.add("selected");
}

function showPage(id, push = true) {
  if (!document.getElementById(id)) return;
  currentPage = id;
  pages.forEach(page => {
    page.classList.toggle("active", page.id === id);
  });
  selectedIndex = 0;
  screen.scrollTop = 0;
  updateSelection();

  if (push) history.pushState({page:id}, "", "#" + id);

  if (id !== "home") video.pause();
  else video.play().catch(() => {});
}

function openProfile(index) {
  const c = characters[index];
  if (!c) return;

  document.getElementById("profileName").textContent = c.name;
  document.getElementById("profileText").textContent =
    c.intro + "\n\nPROFILE\n" + c.details +
    "\n\nSTORY / BACKGROUND\n" + c.story;

  const img = document.getElementById("profileImage");
  if (c.image) {
    img.src = c.image;
    img.hidden = false;
  } else {
    img.removeAttribute("src");
    img.hidden = true;
  }
  showPage("profile");
}

const characterGrid = document.getElementById("characterGrid");

characters.forEach((c, i) => {
  const button = document.createElement("button");
  button.className = "character-tile";
  const avatar = document.createElement("div");
  avatar.className = "avatar";

  if (c.image) {
    const img = document.createElement("img");
    img.src = c.image;
    img.alt = c.name;
    avatar.appendChild(img);
  } else {
    avatar.textContent = i === 0 ? "🐟" : "🐢";
  }

  const name = document.createElement("span");
  name.textContent = c.name;
  button.append(avatar, name);
  button.addEventListener("click", () => openProfile(i));
  characterGrid.appendChild(button);
});

function renderRecords(items, containerId, parentPage) {
  const container = document.getElementById(containerId);
  container.replaceChildren();

  if (!items.length) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "아직 등록된 기록이 없어요. ♡";
    container.appendChild(empty);
    return;
  }

  items.forEach(item => {
    const button = document.createElement("button");
    button.className = "entry";
    button.textContent = "✧ " + item.title;
    button.addEventListener("click", () => {
      previousRecordPage = parentPage;
      document.getElementById("recordTitle").textContent = item.title;
      document.getElementById("recordBody").replaceChildren();

      const body = document.getElementById("recordBody");
      if (item.image) {
        const img = document.createElement("img");
        img.src = item.image;
        img.alt = item.title;
        img.style.maxWidth = "100%";
        body.appendChild(img);
      }
      if (item.text) {
        const p = document.createElement("p");
        p.textContent = item.text;
        body.appendChild(p);
      }
      showPage("recordDetail");
    });
    container.appendChild(button);
  });
}

renderRecords(comics, "comicList", "comics");
renderRecords(stories, "storyList", "stories");
renderRecords(gallery, "galleryList", "gallery");

const letterList = document.getElementById("letterList");
if (!letters.length) {
  letterList.innerHTML = '<p class="empty">아직 도착한 편지가 없어요. 💌</p>';
}
letters.forEach(letter => {
  const button = document.createElement("button");
  button.className = "entry";
  button.textContent = "💌 " + letter.title;
  button.addEventListener("click", () => {
    document.getElementById("letterTitle").textContent = letter.title;
    document.getElementById("letterBody").textContent = letter.text;
    showPage("letterDetail");
  });
  letterList.appendChild(button);
});

document.addEventListener("click", event => {
  const target = event.target.closest("[data-page]");
  if (target) showPage(target.dataset.page);
});

document.getElementById("recordBack").addEventListener("click", () => {
  showPage(previousRecordPage);
});

function moveSelection(step) {
  const buttons = pageButtons();
  if (!buttons.length) return;
  selectedIndex = (selectedIndex + step + buttons.length) % buttons.length;
  updateSelection();
  buttons[selectedIndex].scrollIntoView({block:"nearest"});
}

document.getElementById("prevBtn").onclick = () => moveSelection(-1);
document.getElementById("nextBtn").onclick = () => moveSelection(1);
document.getElementById("selectBtn").onclick = () => {
  const buttons = pageButtons();
  if (buttons[selectedIndex]) buttons[selectedIndex].click();
};

document.addEventListener("keydown", event => {
  if (["ArrowLeft","ArrowUp"].includes(event.key)) {
    event.preventDefault();
    moveSelection(-1);
  }
  if (["ArrowRight","ArrowDown"].includes(event.key)) {
    event.preventDefault();
    moveSelection(1);
  }
  if (event.key === "Enter" && event.target.tagName !== "BUTTON") {
    const buttons = pageButtons();
    if (buttons[selectedIndex]) buttons[selectedIndex].click();
  }
  if (event.key === "Escape") {
    showPage("home");
  }
});

const soundButton = document.getElementById("soundButton");
soundButton.onclick = () => {
  video.muted = !video.muted;
  soundButton.textContent = video.muted
    ? "🔇 영상 소리 켜기"
    : "🔊 영상 소리 끄기";
};

const pauseButton = document.getElementById("pauseButton");
pauseButton.onclick = () => {
  if (video.paused) {
    video.play().catch(() => {});
    pauseButton.textContent = "⏸ 영상 일시정지";
  } else {
    video.pause();
    pauseButton.textContent = "▶ 영상 재생";
  }
};

window.addEventListener("popstate", () => {
  const id = location.hash.slice(1);
  showPage(document.getElementById(id) ? id : "home", false);
});

const startPage = location.hash.slice(1);
showPage(document.getElementById(startPage) ? startPage : "home", false);
</script>
</body>
</html>
